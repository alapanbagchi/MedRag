[project]
name = "medrag"
version = "0.1.0"
description = "Structure-aware RAG pipeline for PMC/JATS biomedical articles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3",
  "docling",
  "faiss-cpu",
  "httpx",
  "logfire",
  "deepagents>=0.7.12",
  "langchain-openai",
  "langchain-text-splitters",
  "langgraph>=1.2.11",
  "lxml",
  "markdown-it-py>=3",
  "PyYAML",
  "numpy",
  "pandas",
  "pgvector",
  "psycopg2-binary",
  "pyarrow",
  "pydantic",
  "pydantic-ai==2.43.0",
  "ag-ui-protocol>=0.1.19",
  "python-dotenv",
  "requests",
  "scipy",
  "torch",
  "tqdm",
  "transformers",
  "firecrawl-py>=1.17,<2",
  "fastapi>=0.141.1",
  "uvicorn>=0.30.0",
  "watchfiles>=0.21.0",
  "langfuse>=4.15.1",
  "dotenv>=0.9.9",
  "typesafe-sdk>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
  "src",
  "src.agents",
  "src.budget",
  "src.chunking",
  "src.embedding",
  "src.ingestion",
  "src.lib",
  "src.llm",
  "src.middleware",
  "src.processing",
  "src.prompts",
  "src.retrieval",
  "src.runstate",
  "src.tools",
  "src.umls",
]

[tool.setuptools.package-data]
"src.prompts" = ["*.txt"]
"src.prompts.agents" = ["*.txt"]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
]

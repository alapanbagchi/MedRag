# SearXNG - self-hosted metasearch engine (no tracking, JSON API for xdeep).
# Usage: docker compose -f searxng.docker-compose.yml up -d
#   then xdeep hits http://127.0.0.1:8888 (XDEEP_SEARXNG_URL default)
# Config lives in ./searxng/settings.yml (auto-seeded on first start).
#
# IMPORTANT (JSON API / 403 fix):
#   Modern SearXNG images only serve format=json when it is whitelisted.
#   If the RAG agent gets HTTP 403 on /search?format=json, the settings.yml
#   is missing 'search.formats: [json]'. Apply:
#
#     sudo chown -R \$(id -u):\$(id -g) searxng      # take ownership once
#     cp searxng-settings-fixed.yml searxng/settings.yml
#     docker compose -f searxng.docker-compose.yml up -d --force-recreate
#
# The searxng container runs unprivileged and creates ./searxng owned by its
# internal uid (nobody) - that is why the file is not host-writable without
# the chown above.

services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-to-a-long-random-string}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

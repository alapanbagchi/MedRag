<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic V3 - Evidence Workspace</title>
<style>
  :root {
    --bg: #0a0a0c; --panel: #0f0f12; --panel2: #14141a; --panel3: #1a1a22;
    --border: #1f1f28; --border2: #2a2a35; --border3: #353544;
    --text: #e8e8ec; --muted: #7c7c88; --dim: #56565e;
    --input: #3b82f6; --model: #8b5cf6; --tools: #06b6d4; --subtool: #e8853a;
    --green: #2fbf71; --red: #f04f4f; --amber: #ffb02e; --blue: #4da3ff;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 12.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; overflow: auto;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #232328; border-radius: 6px; }
  header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 9px 16px; border-bottom: 1px solid var(--border); background: var(--bg);
    position: sticky; top: 0; z-index: 5;
  }
  header .brand { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  header .brand .ptc { font-size: 10px; color: var(--muted); border: 1px solid var(--border3); padding: 1px 6px; border-radius: 6px; }
  header .right { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.running { background: var(--amber); animation: pulse 1s infinite; box-shadow: 0 0 6px var(--amber); }
  .dot.done { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.failed { background: var(--red); box-shadow: 0 0 6px var(--red); }
  @keyframes pulse { 50% { opacity: .35; } }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border2);
    border-radius: 6px; padding: 5px 10px; font-size: 11.5px; font-weight: 500;
    cursor: pointer; transition: background .15s;
  }
  button:hover { background: var(--panel3); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .toolbar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 36px; background: var(--bg); z-index: 4;
  }
  .toolbar input {
    flex: 1 1 auto; max-width: 720px; background: var(--panel2); border: 1px solid var(--border2);
    color: var(--text); border-radius: 6px; padding: 5px 10px; font-size: 11.5px; outline: none;
  }
  .toolbar input:focus { border-color: var(--blue); }
  .toolbar .q { color: var(--muted); font-size: 11px; }
  .legend { display: flex; gap: 16px; padding: 5px 16px 7px; font-size: 10.5px; color: var(--muted); border-bottom: 1px solid var(--border); position: sticky; top: 74px; background: var(--bg); z-index: 3; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  #summary { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .card { flex: 1 1 180px; background: var(--panel2); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 12px; }
  .card .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .card .v { font-size: 13.5px; font-weight: 600; font-family: var(--mono); margin-top: 2px; }
  #app { flex: 1 1 auto; display: grid; grid-template-columns: minmax(340px, 1fr) minmax(560px, 1.5fr); gap: 0; }
  #left, #right { padding: 12px 16px; min-width: 0; }
  #left { border-right: 1px solid var(--border); }
  h3 { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 14px 0 8px; }
  .task { background: var(--panel2); border: 1px solid var(--border2); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .task > .t-head { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
  .t-head .t-title { font-weight: 600; }
  .t-head .t-id { font-family: var(--mono); font-size: 10px; color: var(--muted); }
  .t-head .t-obj { color: var(--muted); font-size: 11px; margin-left: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 8px; white-space: nowrap; text-transform: uppercase; letter-spacing: .2px; }
  .chip.unsatisfied { background: #3a2a12; color: var(--amber); }
  .chip.partially_supported { background: #33301c; color: #e6d27a; }
  .chip.satisfied { background: #153324; color: var(--green); }
  .chip.exhausted { background: #3a1618; color: #ff7b72; }
  .chip.insufficient { background: #3a2a12; color: var(--amber); }
  .chip.open { background: #3a2a12; color: var(--amber); }
  .chip.running { background: #33280f; color: var(--amber); }
  .chip.pending { background: #23232b; color: var(--muted); }
  .req { padding: 6px 12px 8px; border-bottom: 1px solid #15151a; }
  .req:last-child { border-bottom: 0; }
  .req .r-top { display: flex; align-items: center; gap: 8px; }
  .req .r-text { flex: 1 1 auto; min-width: 0; }
  .req .r-meta { font-family: var(--mono); font-size: 10px; color: var(--dim); white-space: nowrap; }
  .req .r-gap { font-size: 10.5px; color: var(--amber); margin-top: 2px; }
  .evs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .ev { font-size: 10px; font-family: var(--mono); border: 1px solid var(--border2); border-radius: 6px; padding: 2px 7px; cursor: pointer; background: #0c0c12; }
  .ev:hover { border-color: var(--blue); }
  .ev .sup { color: var(--green); }
  .ev .con { color: var(--red); }
  .contra { background: var(--panel2); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; }
  .contra .c-claim { font-weight: 600; }
  .contra .c-kind { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
  .res .ok { color: var(--green); } .res .un { color: var(--red); } .res .pa { color: var(--amber); }
  #answer { background: var(--panel2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; white-space: pre-wrap; }
  #answer .ans-section { margin-top: 8px; }
  #answer .ans-section b { display: block; margin-bottom: 3px; color: var(--blue); }
  #answer .lim { font-size: 11px; color: var(--muted); margin-top: 8px; }

  /* ===== grouped agent workspace ===== */
  .group { margin-bottom: 14px; }
  .group-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--border2); border-radius: 8px 8px 0 0; background: var(--panel3); }
  .group-head .g-title { font-weight: 700; font-size: 12px; }
  .group-head .g-meta { color: var(--muted); font-size: 10.5px; margin-left: auto; font-family: var(--mono); }
  .group-body { border: 1px solid var(--border2); border-top: 0; border-radius: 0 0 8px 8px; background: var(--panel); padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .agent { border: 1px solid var(--border2); border-radius: 8px; background: var(--panel2); overflow: hidden; }
  .agent > .a-head { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .agent > .a-head:hover { background: var(--panel3); }
  .a-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .a-dot.running { background: var(--amber); animation: pulse 1s infinite; }
  .a-dot.done { background: var(--green); }
  .a-dot.failed { background: var(--red); }
  .a-name { font-weight: 700; font-size: 11.5px; color: var(--blue); flex: 0 0 auto; }
  .a-label { font-family: var(--mono); font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .a-meta { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--dim); white-space: nowrap; }
  .a-body { padding: 6px 10px 8px; }
  .a-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .achip { font-size: 9.5px; font-family: var(--mono); color: var(--muted); border: 1px solid var(--border2); padding: 1px 6px; border-radius: 6px; cursor: pointer; }
  .achip:hover { border-color: var(--blue); color: var(--text); }
  .achip.ok { color: var(--green); }
  .achip.warn { color: var(--amber); }
  .achip.bad { color: var(--red); }
  .box { border: 1px solid var(--border); border-radius: 6px; background: #0b0b10; margin-bottom: 5px; overflow: hidden; }
  .box summary { cursor: pointer; padding: 5px 9px; font-size: 10px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); list-style: none; display: flex; align-items: center; justify-content: space-between; background: #0d0d12; }
  .box summary::-webkit-details-marker { display: none; }
  .box summary:hover { background: #13131a; }
  .box[open] summary { border-bottom: 1px solid var(--border); color: var(--text); }
  .box pre { margin: 0; padding: 7px 9px; font: 10.5px var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; color: #cfcfe0; }
  .box pre.thought { color: var(--amber); }
  .box pre.sys { color: #b9c6e8; }
  .task-events { border: 1px dashed var(--border2); border-radius: 6px; padding: 4px 8px; font-size: 10px; color: var(--muted); }
  .task-events summary { cursor: pointer; color: var(--muted); }
  .task-events summary:hover { color: var(--text); }
  .te-row { padding: 2px 0; border-bottom: 1px solid #141419; font-family: var(--mono); font-size: 9.8px; cursor: pointer; }
  .te-row:hover { color: var(--text); }
  .te-row .tag { color: var(--tools); }

  #tl { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 0; margin-bottom: 10px; overflow-x: auto; }
  .lane { display: flex; align-items: center; height: 22px; }
  .lane-label { flex: 0 0 120px; padding: 0 10px; font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lane-track { flex: 1 1 auto; position: relative; height: 100%; min-width: 480px; }
  .tick { position: absolute; top: 5px; bottom: 5px; min-width: 2px; border-radius: 1px; opacity: .85; }
  .tick.model { background: var(--model); }
  .tick.worker { background: var(--tools); }
  .tick.control { background: var(--input); top: 7px; bottom: 7px; }
  .tick.ev { background: var(--green); top: 8px; bottom: 8px; }
  .tick.bar { top: 3px; bottom: 3px; border-radius: 3px; opacity: .92; min-width: 2px; }
  pre { margin: 0; border: 1px solid var(--border); border-radius: 6px; background: #0b0b10; padding: 8px; font: 11px var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 60vh; overflow: auto; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 20; }
  #modal.hidden { display: none; }
  .modal-box { width: min(860px, 92vw); max-height: 88vh; display: flex; flex-direction: column; background: var(--panel2); border: 1px solid var(--border3); border-radius: 10px; overflow: hidden; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .modal-head #mtitle { font-weight: 600; }
  #mbody { padding: 12px 14px; overflow: auto; }
  #mbody h4 { margin: 10px 0 4px; font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
</style>
</head>
<body>
<header>
  <div class="brand">Agentic <span class="ptc">V3</span> · Evidence Workspace</div>
  <div class="right"><span class="dot" id="dot"></span><span id="runstate" style="font-size:11px;color:var(--muted)">idle</span>
    <button id="clearBtn">Clear</button></div>
</header>
<div class="toolbar">
  <input id="q" placeholder="Type a question… e.g. What are the dietary restrictions people with hypertension should follow, and should they take more vitamin D?" spellcheck="false">
  <button id="runBtn">▶ Run</button>
  <span class="q" id="meta"></span>
</div>
<div class="legend">
  <span><i style="background:var(--blue)"></i>agent model call</span>
  <span><i style="background:var(--tools)"></i>task activity</span>
  <span><i style="background:var(--amb er)"></i>replan / running</span>
  <span><i style="background:var(--green)"></i>evidence accepted</span>
  <span><i style="background:var(--red)"></i>rejected / failed</span>
  <span><i style="background:var(--input)"></i>master / control</span>
</div>
<div id="summary"></div>
<div id="app">
  <div id="left">
    <h3>Plan · Tasks</h3><div id="tasks"></div>
    <h3>Contradictions &amp; Resolutions</h3><div id="contra"></div>
    <h3>Final Answer</h3><div id="answer"></div>
  </div>
  <div id="right">
    <h3>Agents by Task</h3><div id="agents"></div>
    <details class="task-events" style="margin-bottom:10px">
      <summary>Full timeline (span view)</summary>
      <div id="tlwrap"></div>
      <div id="tl"></div>
    </details>
  </div>
</div>
<div id="modal" class="hidden"><div class="modal-box">
  <div class="modal-head"><span id="mtitle"></span><button id="mclose" style="background:none;border:0;color:var(--muted);font-size:14px">✕</button></div>
  <div id="mbody"></div>
</div></div>
<script>
var allEvents = [];
var lastIdx = -1;
var running = false;
var pollTimer = null;
var tasks = {};
var taskOrder = [];
var evidence = {};
var contradictions = [];
var finalAnswer = null;
var endReason = "";

// agent-linked log (the pretty view)
var agents = [];            // ordered agent cards
var openAgent = {};         // label -> agent index while running
var taskEvents = {};        // task id -> [{type, summary, ev, _idx}]
var agentCount = 0;
var sysPrompts = {};        // agent -> {file, prompt} (fetched from /system_prompts)

function loadSystemPrompts() {
  fetch("/system_prompts").then(function (r) { return r.json(); })
    .then(function (d) { sysPrompts = d || {}; render(); })
    .catch(function () { sysPrompts = {}; });
}

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function trunc(s, n) { s = String(s == null ? "" : s); return s.length > n ? s.slice(0, n) + "…" : s; }
function pretty(o) { try { return JSON.stringify(o, null, 2); } catch (e) { return String(o); } }
function fmtDur(sec) {
  if (sec == null || sec < 0) return "?";
  if (sec < 60) return sec.toFixed(1) + "s";
  var m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return m + "m" + String(s).padStart(2, "0") + "s";
}
function fmtTs(ts) {
  var d = new Date(ts * 1000);
  var p = function (x) { return (x < 10 ? "0" : "") + x; };
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function scopeOf(ev) {
  var parts = [];
  if (ev.task_id) parts.push("T:" + ev.task_id);
  if (ev.requirement_id) parts.push("R:" + ev.requirement_id);
  if (ev.attempt_id) parts.push("A:" + ev.attempt_id);
  if (ev.evidence_id) parts.push("E:" + ev.evidence_id);
  return parts.join(" ");
}
function chip(status, label) {
  var cls = String(status == null ? "" : status).replace(/\s+/g, "_").toLowerCase();
  var lbl = label || status || "?";
  return '<span class="chip ' + cls + '">' + esc(lbl) + "</span>";
}

/* ============ ingest ============ */
function ingest(events) {
  var i, ev;
  for (i = 0; i < events.length; i++) {
    ev = events[i];
    allEvents.push(ev);
    if (ev.type === "master_plan") ingestPlan(ev);
    else if (ev.type === "task_start") ensureTask(ev.task_id);
    else if (ev.type === "task_done") { if (tasks[ev.task_id]) tasks[ev.task_id].status = ev.status; }
    else if (ev.type === "requirement_state") { /* used by tasks panel */ }
    else if (ev.type === "worker_report") ingestReport(ev);
    else if (ev.type === "contradiction") contradictions.push(ev);
    else if (ev.type === "resolution") attachResolution(ev);
    else if (ev.type === "run_end") {
      endReason = ev.stop_reason;
      running = false;
      if (!finalAnswer) finalAnswer = typeof ev.answer === "string"
        ? { summary: ev.answer, sections: [], limitations: [], unresolved_gaps: [], unresolved_contradictions: [] }
        : (ev.answer || null);
    }
    else if (ev.type === "answer") { finalAnswer = ev.report || ev; }
    ingestAgentLog(ev);   // the pretty agent-linked view
  }
}
function ensureTask(tid) {
  if (!tid || tasks[tid]) return;
  tasks[tid] = { id: tid, title: tid, objective: "", requirements: {}, status: "pending" };
  taskOrder.push(tid);
  if (!taskEvents[tid]) taskEvents[tid] = [];
}
function ingestPlan(ev) {
  var list = (ev.tasks || []), i, t;
  for (i = 0; i < list.length; i++) {
    t = list[i];
    tasks[t.id] = {
      id: t.id, title: t.title || t.id, objective: t.objective || "",
      status: "pending", requirements: {}
    };
    if (taskOrder.indexOf(t.id) < 0) taskOrder.push(t.id);
    if (!taskEvents[t.id]) taskEvents[t.id] = [];
    var rs = t.evidence_requirements || [], j, r;
    for (j = 0; j < rs.length; j++) {
      r = rs[j];
      tasks[t.id].requirements[r.id] = { id: r.id, text: r.text || "", target_n: r.target_n || 3, status: r.status || "unsatisfied" };
    }
  }
}
function ingestReport(ev) {
  var tid = ev.task_id;
  ensureTask(tid);
  var rs = ev.requirements || [], i, r, k;
  for (i = 0; i < rs.length; i++) {
    r = rs[i];
    if (tasks[tid] && tasks[tid].requirements[r.requirement_id]) {
      tasks[tid].requirements[r.requirement_id].status = r.status;
      tasks[tid].requirements[r.requirement_id].papers = r.papers || [];
      tasks[tid].requirements[r.requirement_id].coverage = r.coverage;
    }
  }
  if (tasks[tid]) { tasks[tid].status = ev.status; tasks[tid].stop_reason = ev.stop_reason; }
  var es = ev.evidence || [], j, e;
  for (j = 0; j < es.length; j++) { e = es[j]; if (e && e.id) evidence[e.id] = e; }
  for (i = 0; i < rs.length; i++) {
    var papers = rs[i].papers || [], p;
    for (k = 0; k < papers.length; k++) {
      p = papers[k];
      if (p && p.evidence_id && !evidence[p.evidence_id]) {
        evidence[p.evidence_id] = Object.assign({}, p, { requirement_id: rs[i].requirement_id, task_id: tid });
      }
    }
  }
}
function attachResolution(ev) {
  var cid = ev.contradiction_id, i;
  for (i = 0; i < contradictions.length; i++) {
    if (contradictions[i].id === cid) {
      contradictions[i].resolution_status = ev.status;
      contradictions[i].resolution_explanation = ev.explanation;
      contradictions[i].additional_papers = ev.additional_papers || [];
    }
  }
}

/* ============ agent-linked log ============ */
function taskIdOf(seg) {
  // normalize "T1.R1" (a requirement id) -> "T1"; keep "T1" as-is
  var m = /^(T\d+)(?:\.R\d+)?$/.exec(String(seg || ""));
  return m ? m[1] : seg;
}
function agentTask(agent, label) {
  // map an llm observer event to the task it belongs to (MASTER = global)
  if (agent === "master_orchestrator") return "MASTER";
  if (agent === "contradiction_agent") return "MASTER";
  if (agent === "synthesizer_v3") return "MASTER";
  var s = String(label || "").split(":");
  if (agent === "search_term_planner" || agent === "critic") return taskIdOf(s[1]) || "MASTER";
  if (agent === "replanner") return taskIdOf(s[2]) || "MASTER";
  if (agent === "paper_inspector") return docTask[s[1]] || "MASTER";
  if (String(agent || "").indexOf("resolution") === 0) return "MASTER";
  if (String(agent || "").indexOf("paper_inspector") === 0) return docTask[s[1]] || "MASTER";
  return "MASTER";
}
var docTask = {};   // document_id -> task_id (for the paper inspector)
function agentName(agent) {
  var map = {
    master_orchestrator: "Master", search_term_planner: "Search Planner",
    critic: "Critic", replanner: "Replanner", paper_inspector: "Paper Inspector",
    contradiction_agent: "Contradiction Agent", resolution_agent: "Resolution Agent",
    synthesizer_v3: "Synthesizer", planner: "Planner", verifier: "Verifier"
  };
  var a = String(agent || "");
  return map[a] || a;
}
function pushTaskEvent(task, row) {
  if (!taskEvents[task]) taskEvents[task] = [];
  taskEvents[task].push(row);
  // keep bounded
  if (taskEvents[task].length > 400) taskEvents[task].splice(0, taskEvents[task].length - 400);
}
function ingestAgentLog(ev) {
  if (ev.type === "llm_call_start") {
    var idx = agents.length;
    var card = {
      id: "ag" + (agentCount++), agent: ev.agent || "?", label: ev.label || ev.agent || "call",
      task: agentTask(ev.agent, ev.label), status: "running", st: ev.ts, dur: null,
      input: "", thought: "", output: "", chips: [], raw: null
    };
    openAgent[card.label] = idx;
    agents.push(card);
    return;
  }
  if (ev.type === "llm_call") {
    var oi = openAgent[ev.label];
    if (oi == null) {
      // no open start (e.g. retro-fed stream): attach to the last card with this label
      for (var i = agents.length - 1; i >= 0; i--) {
        if (agents[i].label === ev.label) { oi = i; break; }
      }
    }
    if (oi == null) return;
    var c = agents[oi];
    c.input = ev.input || "";
    c.thought = ev.thought || "";
    c.output = ev.output;
    c.raw = ev;
    c.status = "done";
    c.dur = Math.max(0, (ev.ts - c.st) * 1000);
    if (openAgent[ev.label]) delete openAgent[ev.label];
    return;
  }
  // tool / control events -> chips on the current agent of the task, else task log
  var task = ev.task_id || "MASTER";
  var row = { type: ev.type, summary: chipSummary(ev), ts: ev.ts, ev: ev };
  // attach to the most recent agent card of this task (not MASTER control events)
  var attach = false;
  if (task !== "MASTER" && ["search_round", "retrieved", "verdict", "evidence_state",
      "requirement_state", "evidence_added", "replan", "deep_inspection"].indexOf(ev.type) >= 0) {
    for (var j = agents.length - 1; j >= 0; j--) {
      if (agents[j].task === task) { agents[j].chips.push(row); attach = true; break; }
    }
    if (!attach) pushTaskEvent(task, row);
    return;
  }
  // document mapping for the paper inspector
  if (ev.type === "deep_inspection" && ev.document_id) docTask[ev.document_id] = ev.task_id || task;
  pushTaskEvent(task, row);
}
function chipSummary(ev) {
  var t = ev.type;
  if (t === "search_round") { var q = ev.queries || {}; var n = 0; for (var k in q) n += q[k].length; return "search round " + (ev.round_no || 1) + " (" + n + " queries)"; }
  if (t === "retrieved") return "retrieved " + (ev.papers || []).length + " papers" + (ev.attempt_id ? " · " + ev.attempt_id : "");
  if (t === "verdict") return "verdict " + (ev.relevance || "?") + " · " + (ev.document_id || "?");
  if (t === "evidence_state") return "evidence " + ev.old_state + "→" + ev.new_state + " · " + (ev.evidence_id || "");
  if (t === "requirement_state") return "requirement " + ev.old_state + "→" + ev.new_state + " (" + ev.coverage + "/" + ev.target_n + ")";
  if (t === "evidence_added") return "evidence added " + (ev.document_id || "?") + " [" + ev.support + "]";
  if (t === "replan") return "replan " + (ev.attempt_id || "") + " · " + (ev.queries || []).length + " queries";
  if (t === "deep_inspection") return "deep inspection " + (ev.document_id || "?") + " · " + ev.status;
  if (t === "worker_report") return "report " + ev.status + (ev.stop_reason ? " · " + ev.stop_reason : "");
  if (t === "task_start") return "worker start: " + (ev.title || ev.task_id);
  if (t === "task_done") return "worker done: " + ev.status;
  if (t === "terminology_pool") return "UMLS terminology · " + (ev.concepts || []).length + " concepts";
  if (t === "master_plan") return "master plan · " + (ev.tasks || []).length + " tasks";
  if (t === "contradiction") return "contradiction " + (ev.claim || ev.id || "").slice(0, 60);
  if (t === "resolution") return "resolution " + ev.contradiction_id + " → " + ev.status;
  if (t === "final_evidence") return "final evidence set · " + ev.evidence + " verified · " + ev.contradictions + " contrad.";
  if (t === "answer") return "final answer generated";
  if (t === "run_end") return "run end: " + (ev.stop_reason || "");
  if (t === "run_start") return "run started" + (ev.run_id ? " · " + ev.run_id : "");
  return t;
}
function chipClass(type) {
  if (type === "evidence_state") {
    return ""; // per-new_state coloring handled in rows below
  }
  if (type === "replan") return "warn";
  if (type === "formatter") return "warn";
  if (type === "cancelled" || type === "failed") return "bad";
  if (type === "evidence_added" || type === "verdict") return "ok";
  return "";
}
function agentCardHTML(c) {
  var st = c.status;
  var dotCls = st === "running" ? "running" : (st === "done" ? "done" : "failed");
  var meta = (c.dur != null ? fmtDur(c.dur / 1000) + " · " : "") + fmtTs(c.st);
  var h = '<div class="agent" id="' + c.id + '">' +
    '<div class="a-head" onclick="toggleAgent(this)">' +
    '<span class="a-dot ' + dotCls + '"></span>' +
    '<span class="a-name">' + esc(agentName(c.agent)) + "</span>" +
    '<span class="a-label">' + esc(c.label) + "</span>" +
    '<span class="a-meta">' + esc(meta) + (st === "running" ? " · running" : "") + "</span>" +
    '</div><div class="a-body">';
  // the agent's SYSTEM PROMPT (printed top of every card)
  var sp = sysPrompts[c.agent] || null;
  if (sp) {
    h += '<details class="box" open><summary>System prompt · ' +
      esc(sp.file) + ' · ' + sp.prompt.length +
      ' chars</summary><pre class="sys">' + esc(sp.prompt) + "</pre></details>";
  } else {
    h += '<details class="box"><summary>System prompt · (not loaded)</summary><pre>(none)</pre></details>';
  }
  // linked tool chips
  if (c.chips.length) {
    h += '<div class="a-chips">';
    for (var i = 0; i < c.chips.length; i++) {
      var rw = c.chips[i];
      h += '<span class="achip ' + chipClass(rw.type) + '" onclick="openEventRaw(' + rw.ev._idx + ')">' + esc(rw.summary) + "</span>";
    }
    h += "</div>";
  }
  // the three boxes: exact prompt / thinking / response
  var inLen = c.input ? c.input.length : 0;
  h += '<details class="box" open>' +
    '<summary>Prompt · ' + inLen + ' chars</summary><pre>' + esc(c.input || "(none)") + "</pre></details>";
  h += '<details class="box"' + (c.thought ? "" : "") + ">" +
    '<summary>Thinking' + (c.thought ? " · " + c.thought.length + " chars" : "") + '</summary><pre class="thought">' +
    esc(c.thought || "(no thinking block)") + "</pre></details>";
  h += '<details class="box" open>' +
    '<summary>Response · ' + (c.output ? (pretty(c.output).length) : 0) + " chars</summary><pre>" +
    esc(niceOutput(c.output)) + "</pre></details>";
  h += "</div></div>";
  return h;
}
function niceOutput(out) {
  if (out == null) return "(none)";
  if (typeof out === "object") {
    var s = pretty(out);
    // trim overly long nested excerpts for readability, but keep the full JSON clickable
    return s.length > 6000 ? s.slice(0, 6000) + " … [truncated for display; click the card header for full JSON]" : s;
  }
  return String(out);
}
function taskEventsHTML(task, rows) {
  if (!rows || !rows.length) return "";
  var h = '<details class="task-events"><summary>Task events · ' + rows.length + "</summary>";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (!r) continue;
    var bad = (r.type === "evidence_state" && r.ev.new_state === "rejected");
    h += '<div class="te-row" onclick="openEventRaw(' + r._idx + ')">' +
      '<span class="tag">' + esc(r.type) + "</span> · " + esc(r.summary) + (bad ? "  ✗" : "") + "</div>";
  }
  return h + "</details>";
}
function renderAgents() {
  var groups = ["MASTER"];
  for (var i = 0; i < taskOrder.length; i++) if (groups.indexOf(taskOrder[i]) < 0) groups.push(taskOrder[i]);
  var html = "";
  for (var g = 0; g < groups.length; g++) {
    var gname = groups[g];
    var cards = [];
    for (var a = 0; a < agents.length; a++) if (agents[a].task === gname) cards.push(agents[a]);
    var evRows = taskEvents[gname] || [];
    if (!cards.length && !evRows.length && gname !== "MASTER") continue;
    var gLabel = gname === "MASTER" ? "MASTER · orchestrator" : "WORKER:" + gname + (tasks[gname] ? " · " + (tasks[gname].title || "") : "");
    html += '<div class="group"><div class="group-head"><span class="g-title">' + esc(gLabel) + '</span><span class="g-meta">' +
      cards.length + " agent(s) · " + evRows.length + ' event(s)</span></div><div class="group-body">';
    for (var c = 0; c < cards.length; c++) html += agentCardHTML(cards[c]);
    if (evRows.length) html += taskEventsHTML(gname, evRows);
    html += "</div></div>";
  }
  if (!agents.length) html = '<div style="color:var(--dim);padding:8px">No agents yet — run a question, or wait while a CLI-fed run streams in.</div>';
  $("agents").innerHTML = html;
}
function toggleAgent(head) {
  var body = head.parentNode.querySelector(".a-body");
  if (body) body.style.display = (body.style.display === "none" ? "" : "none");
}
function openEventRaw(idx) {
  var ev = null;
  for (var i = 0; i < allEvents.length; i++) if (allEvents[i]._idx === idx) { ev = allEvents[i]; break; }
  if (!ev) return;
  var html = "<h4>Agent: " + esc(ev.agent || "?") + "</h4>";
  if (ev.type === "llm_call") {
    if (ev.input) html += "<h4>Exact prompt (" + ev.input.length + ")</h4><pre>" + esc(ev.input) + "</pre>";
    if (ev.thought) html += '<h4>Thinking</h4><pre class="thought">' + esc(ev.thought) + "</pre>";
    html += "<h4>Response</h4><pre>" + esc(pretty(ev.output)) + "</pre>";
  } else {
    html += "<h4>Event</h4><pre>" + esc(pretty(ev)) + "</pre>";
  }
  openModal(ev.type + (ev.agent ? " · " + ev.agent : "") + " · " + scopeOf(ev), html);
}

/* ============ summary cards ============ */
function renderSummary() {
  var verified = 0, satisfied = 0, totalReq = 0;
  var k, tid, rid;
  for (tid in tasks) for (rid in tasks[tid].requirements) {
    var r = tasks[tid].requirements[rid];
    totalReq++;
    if (r.status === "satisfied") satisfied++;
  }
  for (k in evidence) verified++;
  var html = card("Question", trunc(query(), 60)) +
    card("run_id", last("run_start") ? (last("run_start").run_id || "—") : "—") +
    card("Requirements", satisfied + "/" + totalReq + " satisfied") +
    card("Verified evidence", verified) +
    card("Agents", agents.length) +
    card("Status", running ? "running…" : (endReason || "idle"));
  $("summary").innerHTML = html;
}
function card(k, v) { return '<div class="card"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + "</div></div>"; }
function last(type) { for (var i = allEvents.length - 1; i >= 0; i--) if (allEvents[i].type === type) return allEvents[i]; return null; }
function query() { var q = $("q"); return q ? q.value : ""; }

/* ============ tasks / contradictions / answer ============ */
function renderTasks() {
  var html = "", i;
  for (i = 0; i < taskOrder.length; i++) {
    var t = tasks[taskOrder[i]];
    if (!t) continue;
    html += '<div class="task"><div class="t-head">' +
      chip(t.status, t.status === "running" ? "running" : t.status) +
      '<span class="t-id">' + esc(t.id) + "</span>" +
      '<span class="t-title">' + esc(t.title) + "</span>" +
      '<span class="t-obj">' + esc(trunc(t.objective, 90)) + "</span></div>";
    var rids = [];
    for (var rid in t.requirements) rids.push(rid);
    rids.sort();
    for (var j = 0; j < rids.length; j++) {
      var r = t.requirements[rids[j]];
      var status = r.status || "unsatisfied";
      var cov = (r.coverage != null ? r.coverage : countCoverage(r)) + "/" + r.target_n;
      html += '<div class="req"><div class="r-top">' + chip(status) +
        '<span class="r-text">' + esc(r.text || r.id) + "</span>" +
        '<span class="r-meta">' + (r.papers ? r.papers.length : 0) + " items · " + cov + "</span></div>";
      if (r.gap) html += '<div class="r-gap">' + esc(r.gap) + "</div>";
      if (r.papers && r.papers.length) {
        html += '<div class="evs">';
        for (var k = 0; k < r.papers.length; k++) html += evChip(r.papers[k]);
        html += "</div>";
      }
      html += "</div>";
    }
    html += "</div>";
  }
  if (!taskOrder.length) html = '<div style="color:var(--dim);padding:8px">No tasks yet — run a question.</div>';
  $("tasks").innerHTML = html;
}
function countCoverage(r) {
  var n = 0;
  for (var k in evidence) if (evidence[k].requirement_id === r.id && evidence[k].support === "supports") n++;
  return n;
}
function evChip(p) {
  if (!p) return "";
  var sup = p.support || "supports";
  var cls = sup === "contradicts" ? "con" : "sup";
  return '<span class="ev" data-ev="' + esc(p.evidence_id || p.document_id) +
    '" onclick="openEvidence(this)"><span class="' + cls + '">' +
    esc(p.evidence_id || p.document_id) + "</span> · " + esc(p.document_id || "?") +
    " · " + esc(trunc(String(p.claim || ""), 40)) + "</span>";
}
function openEvidence(el) {
  var id = el.getAttribute("data-ev");
  var e = evidence[id] || {};
  var lines = ["<h4>Evidence</h4>" + esc(id), "<h4>Scope</h4><pre>" + esc(pretty({
    run_id: e.run_id || "", task_id: e.task_id, requirement_id: e.requirement_id,
    attempt_id: e.attempt_id, document_id: e.document_id, chunk_id: e.chunk_id,
    search_query: e.search_query, retrieval_method: e.retrieval_method, rank: e.rank
  })) + "</pre>"];
  if (e.critic_verdict) lines.push("<h4>CRITIC verdict</h4><pre>" + esc(pretty(e.critic_verdict)) + "</pre>");
  if (e.excerpt) lines.push("<h4>Excerpt</h4><pre>" + esc(e.excerpt) + "</pre>");
  if (e.claim) lines.push("<h4>Claim</h4><pre>" + esc(e.claim) + "</pre>");
  openModal("Evidence " + id, lines.join(""));
}
function renderContra() {
  var html = "", i;
  for (i = 0; i < contradictions.length; i++) {
    var c = contradictions[i];
    var resCls = c.resolution_status === "resolved" ? "ok" :
      (c.resolution_status === "partially_resolved" ? "pa" : "un");
    html += '<div class="contra"><div class="c-claim">' + esc(c.id ? c.id + " · " : "") + esc(c.claim || "") +
      '</div><div class="c-kind">' + esc(c.kind || "direct_conflict") +
      " · side A: " + esc((c.evidence_a || []).join(", ")) +
      " · side B: " + esc((c.evidence_b || []).join(", ")) + "</div>";
    if (c.description) html += '<div style="color:var(--muted);font-size:11px">' + esc(c.description) + "</div>";
    if (c.resolution_status) {
      html += '<div class="res ' + resCls + '"><b>' + esc(c.resolution_status.toUpperCase()) + "</b> · " +
        esc(c.resolution_explanation || "") + "</div>";
    }
    html += "</div>";
  }
  if (!contradictions.length) html = '<div style="color:var(--dim);padding:4px">No contradictions detected.</div>';
  $("contra").innerHTML = html;
}
function renderAnswer() {
  var a = finalAnswer;
  var html = "";
  if (!a) { $("answer").innerHTML = '<div style="color:var(--dim)">No answer yet.</div>'; return; }
  if (a.summary) html += "<b>Summary</b>" + esc(a.summary);
  var secs = a.sections || [], i;
  for (i = 0; i < secs.length; i++) {
    var s = secs[i];
    html += '<div class="ans-section"><b>' + esc(s.heading || "Section") + "</b>" + esc(s.body || "") + "</div>";
  }
  var notes = [];
  if ((a.limitations || []).length) notes.push("Limitations: " + a.limitations.join(" | "));
  if ((a.unresolved_gaps || []).length) notes.push("Unresolved gaps: " + a.unresolved_gaps.join(" | "));
  if ((a.unresolved_contradictions || []).length) notes.push("Unresolved contradictions: " + a.unresolved_contradictions.join(" | "));
  if (notes.length) html += '<div class="lim">' + esc(notes.join(" ; ")) + "</div>";
  $("answer").innerHTML = html;
}

/* ============ timeline (derived from agents + events) ============ */
function renderTimeline() {
  var lanes = [{ id: "MASTER", label: "MASTER" }, { id: "MODEL", label: "MODEL" }];
  var i, tid;
  for (i = 0; i < taskOrder.length; i++) lanes.push({ id: "W-" + taskOrder[i], label: "WORKER:" + taskOrder[i] });
  var min = Infinity, max = -Infinity, j;
  for (j = 0; j < allEvents.length; j++) { var e = allEvents[j]; if (e.ts < min) min = e.ts; if (e.ts > max) max = e.ts; }
  if (!isFinite(min)) { $("tl").innerHTML = '<div style="color:var(--dim);padding:8px">No events yet.</div>'; return; }
  var span = (max - min) || 0.001;
  var pos = function (ts) { return ((ts - min) / span) * 100; };
  var tStart = {}, tDone = {}, modelStart = {}, modelEnd = {};
  for (j = 0; j < allEvents.length; j++) {
    var ev = allEvents[j];
    if (ev.type === "task_start") tStart[ev.task_id] = ev.ts;
    if (ev.type === "task_done") tDone[ev.task_id] = ev.ts;
    if (ev.type === "llm_call_start") { var k = ev.label || ev.iteration + ":" + ev.agent; if (!modelStart[k]) modelStart[k] = ev.ts; }
    if (ev.type === "llm_call") { var k2 = ev.label || ev.iteration + ":" + ev.agent; if (!modelEnd[k2]) modelEnd[k2] = ev.ts; else modelEnd[k2] = Math.max(modelEnd[k2], ev.ts); }
  }
  var html = "";
  for (i = 0; i < lanes.length; i++) {
    var lane = lanes[i];
    html += '<div class="lane"><div class="lane-label">' + esc(lane.label) + '</div><div class="lane-track">';
    if (lane.id === "MODEL") {
      var mk, mcount = 0;
      for (mk in modelStart) { var ms = modelStart[mk], me = modelEnd[mk] || ms; if (me < ms) me = ms; html += bar(pos(ms), pos(me), "model", mk); mcount++; }
      if (!mcount) html += '<div style="color:var(--dim);font-size:10px;padding-left:8px">no model calls</div>';
    }
    if (lane.id.indexOf("W-") === 0) {
      tid = lane.id.slice(2);
      if (tStart[tid] && tDone[tid]) html += bar(pos(tStart[tid]), pos(tDone[tid]), "worker", "WORKER " + tid);
      else if (tStart[tid]) html += bar(pos(tStart[tid]), 100, "worker running", "WORKER " + tid + " (running)");
      html += ticksFor(tid, pos);
    }
    html += "</div></div>";
  }
  $("tl").innerHTML = html;
}
function bar(l, r, cls, title) { var w = Math.max(2, r - l); return '<div class="tick bar ' + cls + '" style="left:' + l + "%;width:" + w + '%" title="' + esc(title) + '"></div>'; }
function ticksFor(tid, pos) {
  var html = "", j;
  for (j = 0; j < allEvents.length; j++) {
    var ev = allEvents[j];
    if (ev.task_id !== tid) continue;
    if (ev.type === "search_round") html += tickAt(ev.ts, pos, "control", "SEARCH " + (ev.attempt_id || ev.round_no || ""));
    else if (ev.type === "retrieved") html += tickAt(ev.ts, pos, "worker", "RETRIEVED " + (ev.papers ? ev.papers.length : 0));
    else if (ev.type === "evidence_state") html += tickAt(ev.ts, pos, "ev", ev.new_state + " " + (ev.evidence_id || ""));
    else if (ev.type === "requirement_state") html += tickAt(ev.ts, pos, "control", ev.old_state + "→" + ev.new_state);
    else if (ev.type === "replan") html += tickAt(ev.ts, pos, "control", "REPLAN " + (ev.attempt_id || ""));
  }
  return html;
}
function tickAt(ts, pos, cls, label) { return '<div class="tick ' + cls + '" style="left:' + pos(ts) + '%;min-width:3px" title="' + esc(label) + '"></div>'; }

/* ============ modal ============ */
function openModal(title, html) {
  $("mtitle").textContent = title;
  $("mbody").innerHTML = html;
  $("modal").classList.remove("hidden");
}
function openEvent(idx) { openEventRaw(idx); }
$("mclose").onclick = function () { $("modal").classList.add("hidden"); };
$("modal").onclick = function (e) { if (e.target === $("modal")) $("modal").classList.add("hidden"); };

/* ============ run / poll ============ */
function startPolling() { if (pollTimer) return; pollTimer = setInterval(poll, 700); }
function poll() {
  fetch("/events?after=" + Math.max(0, lastIdx)).then(function (r) { return r.json(); })
    .then(function (data) {
      var evs = data.events || [];
      if (!evs.length) return;
      lastIdx = Math.max.apply(null, evs.map(function (e) { return e._idx; }));
      ingest(evs);
      render();
    }).catch(function () {});
}
function render() {
  renderSummary();
  renderTasks();
  renderContra();
  renderAnswer();
  renderAgents();
  renderTimeline();
  var dot = $("dot");
  dot.className = "dot" + (running ? " running" : (endReason ? " done" : ""));
  $("runstate").textContent = running ? "running" : (endReason ? endReason : "idle");
}
$("runBtn").onclick = function () {
  var q = query();
  if (!q) { alert("Enter a question first."); return; }
  $("runBtn").disabled = true;
  running = true;
  allEvents = []; lastIdx = -1;
  tasks = {}; taskOrder = []; evidence = {}; contradictions = [];
  agents = []; openAgent = {}; taskEvents = {}; docTask = {}; agentCount = 0;
  finalAnswer = null; endReason = "";
  render();   // immediate "running…" feedback
  loadSystemPrompts();  // pick up any prompt edits before this run
  fetch("/clear", { method: "POST" }).then(function () {
    return fetch("/run", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q }) });
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.error) alert(d.error);
    $("runBtn").disabled = false;
    startPolling();
  }).catch(function (e) { alert("run failed: " + e); $("runBtn").disabled = false; running = false; });
};
$("clearBtn").onclick = function () {
  fetch("/clear", { method: "POST" });
  allEvents = []; lastIdx = -1; tasks = {}; taskOrder = [];
  agents = []; openAgent = {}; taskEvents = {}; docTask = {}; agentCount = 0;
  contradictions = []; finalAnswer = null; endReason = "";
  render();
  loadSystemPrompts();
};
startPolling();
poll();
loadSystemPrompts();
</script>
</body>
</html>
